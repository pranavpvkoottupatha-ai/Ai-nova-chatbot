
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101827">
<title>NOVA AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#0b1120;color:#f1f5f9}
header{padding:18px;text-align:center;background:#111c30;border-bottom:1px solid #29364d}
header h1{margin:0;color:#67e8f9;font-size:27px}
header p{margin:7px 0 0;color:#aab8cc;font-size:13px}
main{max-width:760px;margin:auto;padding:16px}
#chat{height:60vh;min-height:300px;overflow-y:auto;padding:12px 0}
.msg{padding:12px 15px;border-radius:15px;margin:10px 0;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}
.user{background:#164e63;margin-left:12%;border-bottom-right-radius:4px}
.bot{background:#1b2940;margin-right:8%;border-bottom-left-radius:4px}
.label{font-size:11px;color:#67e8f9;margin-bottom:5px}
form{display:flex;gap:8px;position:sticky;bottom:0;background:#0b1120;padding:10px 0}
input{min-width:0;flex:1;padding:14px;border:1px solid #34445d;border-radius:12px;background:#111c30;color:white;font-size:16px}
button{border:0;border-radius:12px;padding:12px 16px;background:#06b6d4;color:#06202b;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
#clear{background:#26364d;color:white;font-size:12px;padding:8px 12px}
#status{color:#aab8cc;font-size:12px;min-height:20px}
footer{text-align:center;color:#8493a9;font-size:12px;padding:12px}
</style>
</head>
<body>
<header>
  <h1>✦ NOVA AI</h1>
  <p>Your AI assistant · Ask anything</p>
</header>
<main>
  <p id="status">Ready to chat</p>
  <div id="chat" aria-live="polite">
    <div class="msg bot">
      <div class="label">NOVA AI</div>
      Hi! I'm NOVA AI. Ask me a question, learn something new, or explore an idea!
    </div>
  </div>
  <form id="form">
    <input id="prompt" maxlength="2000" placeholder="Message NOVA AI..." autocomplete="off" required>
    <button id="send" type="submit">Send</button>
  </form>
  <button id="clear" type="button">Clear chat</button>
  <footer>NOVA AI · An experimental AI assistant</footer>
</main>
<script>
// STEP 3: Replace this with your deployed Cloudflare Worker URL.
const WORKER_URL = "PASTE_YOUR_WORKER_URL_HERE";

const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("prompt");
const send = document.getElementById("send");
const statusText = document.getElementById("status");

const history = [];

function addMessage(role, text) {
  const bubble = document.createElement("div");
  bubble.className = "msg " + (role === "user" ? "user" : "bot");

  const label = document.createElement("div");
  label.className = "label";
  label.textContent = role === "user" ? "YOU" : "NOVA AI";

  const content = document.createElement("div");
  content.textContent = text;

  bubble.append(label, content);
  chat.appendChild(bubble);
  chat.scrollTop = chat.scrollHeight;
}

document.getElementById("clear").addEventListener("click", () => {
  history.length = 0;
  chat.replaceChildren();
  addMessage("assistant", "Chat cleared! What would you like to explore?");
  statusText.textContent = "Ready to chat";
});

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const message = input.value.trim();
  if (!message || send.disabled) return;

  if (WORKER_URL === "PASTE_YOUR_WORKER_URL_HERE") {
    statusText.textContent = "Setup needed: connect your Cloudflare Worker first.";
    return;
  }

  addMessage("user", message);
  history.push({ role: "user", content: message });
  input.value = "";
  send.disabled = true;
  statusText.textContent = "NOVA AI is thinking...";

  try {
    const response = await fetch(WORKER_URL + "/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history.slice(-12) })
    });

    const data = await response.json();
    if (!response.ok) {
      throw new Error(data.error || "Request failed (" + response.status + ")");
    }
    if (typeof data.reply !== "string") {
      throw new Error("The AI returned an unexpected response.");
    }

    addMessage("assistant", data.reply);
    history.push({ role: "assistant", content: data.reply });
    statusText.textContent = "Ready to chat";
  } catch (error) {
    // Remove the failed question from the conversation history.
    history.pop();
    addMessage("assistant", "Sorry, I couldn't connect. " + error.message);
    statusText.textContent = "Connection error";
  } finally {
    send.disabled = false;
    input.focus();
  }
});
</script>
</body>
</html>
